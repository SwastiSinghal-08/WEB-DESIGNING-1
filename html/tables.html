<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Employee Tables</title>
</head>
<body>
<table border="5" bgColor="pink" width="300" height="200">
    <caption> EMPLOYEE DETAIL </caption>
    <tbody>
    <thead>
        <tr>
            <td>EMP.NO.</td>
            <td>EMP.NAME</td>
            <td>SALARY</td>
        </tr>
    </thead>
    <tr>
        <td>1</td>
        <td>John Doe</td>
        <td align="right">$1000</td>
    </tr>
    <tr>
        <td>2</td>
        <td>John II</td>
        <td>$1500</td>
    </tr>
    <tr>
        <td>3</td>
        <td>Mark</td>
        <td>$1000</td>
    </tr>
    <tr>
        <td>4</td>
        <td>Steve Jobs</td>
        <td>$1500</td>
    </tr>
    <tr>
        <td colspan="2">EMP. COUNT</td>
        <td>4</td>
    </tr>
    </tbody>
</table>
</body>
</html>
